[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-marketplace-cli"
version = "0.2.1"
description = "Unofficial Facebook Marketplace CLI — speaks Facebook's internal GraphQL with HAR/browser-imported cookies. Stdlib-only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Minzi" }]
keywords = ["facebook", "marketplace", "cli", "scraping", "graphql"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/minzique/fb-cli"
Repository = "https://github.com/minzique/fb-cli"
Issues = "https://github.com/minzique/fb-cli/issues"
Changelog = "https://github.com/minzique/fb-cli/blob/main/CHANGELOG.md"

[project.scripts]
fb-cli = "fb_cli.cli:main"

[tool.setuptools.packages.find]
include = ["fb_cli*"]
exclude = ["tests*"]
